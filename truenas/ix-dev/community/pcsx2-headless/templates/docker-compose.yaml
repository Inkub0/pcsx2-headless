{% set tpl = ix_lib.base.render.Render(values) %}

{% set c1 = tpl.add_container(values.consts.pcsx2_container_name, "image") %}

{% do c1.set_ipc_mode("host") %}
{# 13: input devices (keyboard, mouse and gamepads created by Sunshine) #}
{% do c1.add_device_cgroup_rule("c 13:* rwm") %}

{% if tpl.funcs.has_any_gpu() %}
  {# 226: DRM subsystem (/dev/dri/card*, /dev/dri/renderD*) #}
  {% do c1.add_device_cgroup_rule("c 226:* rwm") %}
  {% do c1.devices.add_dri_device() %}
{% endif %}

{% if tpl.funcs.has_nvidia_gpu() %}
  {# 195: NVIDIA char devices (/dev/nvidia0, /dev/nvidiactl, /dev/nvidia-modeset) #}
  {% do c1.add_device_cgroup_rule("c 195:* rwm") %}
{% endif %}

{# The entrypoint runs as root to set up Xorg, udev and device permissions,
   then runs PulseAudio, Sunshine and PCSX2 as run_as.user/run_as.group. #}
{% do c1.remove_security_opt("no-new-privileges") %}
{% do c1.add_security_opt("seccomp", "unconfined") %}
{% do c1.add_security_opt("apparmor", "unconfined") %}
{% do c1.add_caps([
    "CHOWN",
    "DAC_OVERRIDE",
    "FOWNER",
    "KILL",
    "MKNOD",
    "NET_ADMIN",
    "SETGID",
    "SETUID",
    "SYS_ADMIN",
    "SYS_NICE",
    "SYS_TTY_CONFIG",
]) %}
{% do c1.set_shm_size_mb(values.pcsx2.shm_size_mb) %}
{% do c1.set_hostname(values.consts.pcsx2_container_name) %}

{% do c1.healthcheck.set_test("curl", {"port": 47990, "scheme": "https"}) %}

{% do c1.environment.add_env("PUID", values.run_as.user) %}
{% do c1.environment.add_env("PGID", values.run_as.group) %}
{% do c1.environment.add_env("SUNSHINE_USER", values.pcsx2.sunshine_username) %}
{% do c1.environment.add_env("SUNSHINE_PASS", values.pcsx2.sunshine_password) %}
{% do c1.environment.add_env("SUNSHINE_NAME", values.consts.pcsx2_container_name) %}
{% do c1.environment.add_env("RESOLUTION", values.pcsx2.resolution) %}
{% do c1.environment.add_env("REFRESH_RATE", 60) %}
{% do c1.environment.add_env("GPU_TYPE", values.pcsx2.gpu_type) %}
{% do c1.environment.add_env("TEARFREE", values.pcsx2.tearfree) %}
{% do c1.environment.add_user_envs(values.pcsx2.additional_envs) %}

{% do c1.devices.add_device("/dev/uinput", "/dev/uinput") %}
{# Bind-mounted (not a device entry) so input devices Sunshine creates later still appear #}
{% do c1.add_storage("/dev/input", {"type": "host_path", "host_path_config": {"path": "/dev/input", "create_host_path": false}}) %}

{% do c1.add_storage("/config", values.storage.config) %}
{% do c1.add_storage("/bios", values.storage.bios) %}
{% do c1.add_storage("/games", values.storage.games) %}
{% for store in values.storage.additional_storage %}
  {% do c1.add_storage(store.mount_path, store) %}
{% endfor %}

{% do tpl.notes.add_info("Pair Moonlight in the Sunshine web UI at https://<server-ip>:47990 (accept the self-signed certificate), then start the PCSX2 app from Moonlight.") %}
{% if not values.network.host_network %}
  {% do tpl.notes.add_warning("Host Network is off. Moonlight needs host networking to find and stream from this app.") %}
{% endif %}

{{ tpl.render() | tojson }}
