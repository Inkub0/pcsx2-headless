resources:
  limits:
    cpus: 2.0
    memory: 4096

TZ: Etc/UTC

pcsx2:
  sunshine_username: admin
  sunshine_password: pcsx2-headless-password
  sunshine_webui_access: lan
  sunshine_allowed_origins: https://truenas.local:47990
  resolution: "1920x1080"
  gpu_type: dummy
  numa_node: auto
  display_match: full
  tearfree: false
  covers: true
  covers_style: default
  shm_size_mb: 2048
  additional_envs: []

network:
  host_network: true

run_as:
  user: 568
  group: 568

ix_volumes:
  config: /opt/tests/mnt/config
  bios: /opt/tests/mnt/bios
  games: /opt/tests/mnt/games

storage:
  config:
    type: ix_volume
    ix_volume_config:
      dataset_name: config
      create_host_path: true
  bios:
    type: ix_volume
    read_only: true
    ix_volume_config:
      dataset_name: bios
      create_host_path: true
  games:
    type: ix_volume
    read_only: true
    ix_volume_config:
      dataset_name: games
      create_host_path: true
  additional_storage: []
