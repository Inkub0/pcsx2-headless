name: Build image

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Files that never go into the image. Without this, the commit that pins a new image tag in
    # truenas-custom-app.yaml would itself build another image with another tag.
    # (Path filters don't apply to tag pushes, so releases always build.)
    paths-ignore:
      - "truenas-custom-app.yaml"
      - "truenas/**"
      - "**.md"
      - "assets/**"
  pull_request:
  schedule:
    - cron: "17 4 * * 1"   # weekly rebuild picks up new PCSX2 and Sunshine releases
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/pcsx2-headless
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            IMAGE_VERSION=${{ github.ref_name }}-${{ github.sha }}
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
